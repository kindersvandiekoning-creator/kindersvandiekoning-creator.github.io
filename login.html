<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in — Kinders van die Koning</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    body { background: linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-warm) 100%); }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      background: #fff;
      max-width: 420px;
      width: 100%;
      padding: 44px 40px 38px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      text-align: center;
      border: 1px solid var(--line-soft);
    }
    .login-card img { height: 56px; margin: 0 auto 20px; }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .login-card p.sub { color: var(--text-muted); font-size: .9rem; margin-bottom: 28px; }
    .login-card form { text-align: left; }
    .login-card .back { margin-top: 20px; display: block; font-size: .85rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="/assets/images/logo.png" alt="Kinders van die Koning" style="height:72px; width:auto; margin:0 auto 20px;">
      <h1>Admin sign in</h1>
      <p class="sub">For staff only. If you've forgotten your password, please contact the website administrator.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="input" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
        <p id="login-msg" style="display:none; margin-top:16px;"></p>
      </form>

      <a href="/index.html" class="back">← Back to the website</a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    (function () {
      const form = document.getElementById("login-form");
      const msg  = document.getElementById("login-msg");
      const cfg  = window.KFTK_CONFIG || {};

      // Already logged in? Go straight to admin.
      if (localStorage.getItem("kftk_auth") === "1") {
        window.location.href = "/admin.html";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = form.querySelector("button");
        btn.disabled = true; btn.textContent = "Signing in…";

        const pw = form.password.value;
        const encoder = new TextEncoder();
        const data = encoder.encode(pw);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray  = Array.from(new Uint8Array(hashBuffer));
        const hashHex    = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");

        if (hashHex === cfg.adminPasswordHash) {
          localStorage.setItem("kftk_auth", "1");
          window.location.href = "/admin.html";
        } else {
          msg.className = "notice error";
          msg.style.display = "block";
          msg.textContent = "Incorrect password. Please try again.";
          btn.disabled = false; btn.textContent = "Sign in";
        }
      });
    })();
  </script>
</body>
</html>
