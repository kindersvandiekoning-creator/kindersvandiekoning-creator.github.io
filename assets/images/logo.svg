<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="Kinders vir die Koning">
  <!-- Outer green oval -->
  <ellipse cx="280" cy="200" rx="276" ry="196" fill="#22BB00"/>
  <!-- Blue oval ring -->
  <ellipse cx="280" cy="200" rx="256" ry="178" fill="#1133CC"/>
  <!-- Black oval background -->
  <ellipse cx="280" cy="200" rx="234" ry="160" fill="#000000"/>

  <!-- ── CROWN ── -->
  <!-- Crown body (gold fill) -->
  <polygon points="100,285 100,220 148,248 184,185 220,215 280,175 340,215 376,185 412,248 460,220 460,285"
           fill="#F0C820" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <!-- Crown base band -->
  <rect x="100" y="280" width="360" height="28" rx="4" fill="#E0B010" stroke="#222" stroke-width="2"/>
  <!-- Red jewels on crown -->
  <ellipse cx="192" cy="260" rx="14" ry="18" fill="#CC1111" stroke="#111" stroke-width="2"/>
  <ellipse cx="280" cy="248" rx="14" ry="18" fill="#CC1111" stroke="#111" stroke-width="2"/>
  <ellipse cx="368" cy="260" rx="14" ry="18" fill="#CC1111" stroke="#111" stroke-width="2"/>
  <!-- Gold highlights on jewels -->
  <ellipse cx="188" cy="255" rx="5" ry="6" fill="rgba(255,220,60,0.45)"/>
  <ellipse cx="276" cy="243" rx="5" ry="6" fill="rgba(255,220,60,0.45)"/>
  <ellipse cx="364" cy="255" rx="5" ry="6" fill="rgba(255,220,60,0.45)"/>

  <!-- ── CHILDREN FIGURES (5 diverse cartoon kids standing on the crown) ── -->
  <!-- Child 1 (left, blue top) -->
  <circle cx="148" cy="188" r="16" fill="#F5C89A" stroke="#333" stroke-width="1.5"/>
  <rect x="136" y="204" width="24" height="26" rx="4" fill="#3366CC" stroke="#222" stroke-width="1.5"/>
  <line x1="136" y1="218" x2="122" y2="234" stroke="#F5C89A" stroke-width="7" stroke-linecap="round"/>
  <line x1="160" y1="218" x2="174" y2="234" stroke="#F5C89A" stroke-width="7" stroke-linecap="round"/>
  <line x1="142" y1="230" x2="136" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="154" y1="230" x2="160" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <!-- Child 1 hair -->
  <path d="M132,188 Q148,170 164,188" fill="#5C3010" stroke="none"/>

  <!-- Child 2 (second from left, green top) -->
  <circle cx="198" cy="180" r="16" fill="#7B4F2A" stroke="#333" stroke-width="1.5"/>
  <rect x="186" y="196" width="24" height="26" rx="4" fill="#22AA44" stroke="#222" stroke-width="1.5"/>
  <line x1="186" y1="210" x2="172" y2="226" stroke="#7B4F2A" stroke-width="7" stroke-linecap="round"/>
  <line x1="210" y1="210" x2="224" y2="226" stroke="#7B4F2A" stroke-width="7" stroke-linecap="round"/>
  <line x1="192" y1="222" x2="186" y2="240" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="204" y1="222" x2="210" y2="240" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <!-- Child 2 - green cap -->
  <ellipse cx="198" cy="170" rx="18" ry="10" fill="#228833"/>
  <rect x="182" y="170" width="32" height="7" rx="3" fill="#1A6628"/>

  <!-- Child 3 (centre, pink top) -->
  <circle cx="280" cy="168" r="18" fill="#FDDCB5" stroke="#333" stroke-width="1.5"/>
  <rect x="266" y="186" width="28" height="28" rx="4" fill="#DD4499" stroke="#222" stroke-width="1.5"/>
  <line x1="266" y1="200" x2="250" y2="216" stroke="#FDDCB5" stroke-width="7" stroke-linecap="round"/>
  <line x1="294" y1="200" x2="310" y2="216" stroke="#FDDCB5" stroke-width="7" stroke-linecap="round"/>
  <line x1="272" y1="214" x2="266" y2="234" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="288" y1="214" x2="294" y2="234" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <!-- Child 3 hair (blonde) -->
  <path d="M262,162 Q280,144 298,162 Q292,150 280,148 Q268,150 262,162Z" fill="#D4A020"/>
  <path d="M261,168 Q258,180 262,190" fill="none" stroke="#D4A020" stroke-width="5" stroke-linecap="round"/>
  <path d="M299,168 Q302,180 298,190" fill="none" stroke="#D4A020" stroke-width="5" stroke-linecap="round"/>

  <!-- Child 4 (right of centre, brown/red top) -->
  <circle cx="362" cy="180" r="16" fill="#C87A50" stroke="#333" stroke-width="1.5"/>
  <rect x="350" y="196" width="24" height="26" rx="4" fill="#BB3322" stroke="#222" stroke-width="1.5"/>
  <line x1="350" y1="210" x2="336" y2="226" stroke="#C87A50" stroke-width="7" stroke-linecap="round"/>
  <line x1="374" y1="210" x2="388" y2="226" stroke="#C87A50" stroke-width="7" stroke-linecap="round"/>
  <line x1="356" y1="222" x2="350" y2="240" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="368" y1="222" x2="374" y2="240" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <!-- Child 4 hair (dark wavy) -->
  <path d="M346,176 Q362,158 378,176 Q374,164 362,162 Q350,164 346,176Z" fill="#2A1A0A"/>

  <!-- Child 5 (far right, playing guitar / orange top) -->
  <circle cx="412" cy="188" r="16" fill="#8B5020" stroke="#333" stroke-width="1.5"/>
  <rect x="400" y="204" width="24" height="26" rx="4" fill="#FF8811" stroke="#222" stroke-width="1.5"/>
  <line x1="400" y1="218" x2="386" y2="234" stroke="#8B5020" stroke-width="7" stroke-linecap="round"/>
  <line x1="424" y1="218" x2="438" y2="234" stroke="#8B5020" stroke-width="7" stroke-linecap="round"/>
  <line x1="406" y1="230" x2="400" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <line x1="418" y1="230" x2="424" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <!-- Guitar -->
  <ellipse cx="438" cy="228" rx="11" ry="14" fill="#A0620A" stroke="#222" stroke-width="1.5"/>
  <rect x="437" y="214" width="3" height="18" fill="#7A4A08"/>
  <line x1="432" y1="220" x2="444" y2="220" stroke="#ccc" stroke-width="1"/>
  <line x1="431" y1="224" x2="443" y2="224" stroke="#ccc" stroke-width="1"/>
  <!-- Child 5 hair (dark curly) -->
  <path d="M396,184 Q412,166 428,184" fill="#1A0A00" stroke="none"/>
</svg>
